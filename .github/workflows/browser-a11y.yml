name: Browser and accessibility regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned browser-test tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.oss.config.ts
